[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scholar-forge"
version = "0.1.0"
description = "Bundle-first scholarly evidence compiler for agents."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "ScholarForge contributors"},
]
keywords = ["academic", "research", "literature", "papers", "agents", "evidence", "bundles", "provenance"]
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24"]
dev = ["pytest>=8.0"]

[project.scripts]
scholar-forge = "scholar_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests that call live external services",
]
